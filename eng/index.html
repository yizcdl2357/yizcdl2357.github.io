<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语作文语料库</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" data-page="home" type="button">英语作文语料库</button>
      <nav class="nav" aria-label="主导航">
        <button data-page="home" type="button">首页</button>
        <button data-page="corpus" type="button">语料库</button>
        <button data-page="upload" type="button">上传优文</button>
      </nav>
      <div class="auth-area" id="authArea"></div>
    </div>
  </header>

  <main>
    <section class="page hero-page active" id="homePage">
      <div class="hero">
        <div class="hero-copy">
          <p class="eyebrow">English Writing Corpus</p>
          <h1>英语作文语段备战库</h1>
          <p>按主题收集优文语段，积累表达，检索同类素材，让写作准备更有章法。</p>
          <div class="hero-actions">
            <button class="primary" data-page="corpus" type="button">浏览语料库</button>
            <button class="secondary" data-page="upload" type="button">上传语段</button>
          </div>
        </div>
        <div class="hero-panel">
          <h2>近期语段</h2>
          <div id="homeRecentList" class="compact-list"></div>
        </div>
      </div>
      <section class="section">
        <div class="section-title">
          <h2>作文主题</h2>
        </div>
        <div class="theme-grid" id="featuredThemes"></div>
      </section>
    </section>

    <section class="page" id="loginPage">
      <div class="form-shell">
        <h1>登录</h1>
        <form id="loginForm" class="form">
          <label>
            用户名
            <input id="loginUsername" type="text" autocomplete="username">
          </label>
          <label>
            密码
            <input id="loginPassword" type="password" autocomplete="current-password">
          </label>
          <p class="message" id="loginMessage"></p>
          <button class="primary full" type="submit">登录</button>
          <button class="link-button" data-page="register" type="button">还没有账号？去注册</button>
        </form>
      </div>
    </section>

    <section class="page" id="registerPage">
      <div class="form-shell">
        <h1>注册</h1>
        <form id="registerForm" class="form">
          <label>
            用户名
            <input id="registerUsername" type="text" autocomplete="username">
          </label>
          <label>
            密码
            <input id="registerPassword" type="password" autocomplete="new-password">
          </label>
          <p class="message" id="registerMessage"></p>
          <button class="primary full" type="submit">创建账号</button>
          <button class="link-button" data-page="login" type="button">已有账号？去登录</button>
        </form>
      </div>
    </section>

    <section class="page" id="uploadPage">
      <div class="section-title">
        <h1>上传优文语段</h1>
      </div>
      <form id="uploadForm" class="form wide-form">
        <label>
          语段内容
          <textarea id="paragraphContent" rows="8" placeholder="粘贴或输入值得积累的英文语段"></textarea>
        </label>
        <section class="ocr-panel" aria-label="拍照识别文字">
          <div>
            <h2>拍照识别文字</h2>
            <p class="muted">拍摄或选择包含英文语段的图片，识别结果会自动填入上方语段内容。</p>
          </div>
          <div class="ocr-controls">
            <label class="file-picker">
              选择图片 / 拍照
              <input id="ocrImageInput" type="file" accept="image/*" capture="environment">
            </label>
            <button class="secondary" id="recognizeImageButton" type="button">识别文字</button>
          </div>
          <img class="ocr-preview" id="ocrPreview" alt="待识别图片预览" hidden>
          <p class="message" id="ocrMessage"></p>
        </section>
        <div class="form-row">
          <label>
            作文主题
            <input id="paragraphTheme" type="text" placeholder="例如：成长 / 科技 / 诚信">
          </label>
        </div>
        <p class="muted" id="themeSuggestionMessage"></p>
        <fieldset>
          <legend>标签</legend>
          <div id="uploadTags" class="tag-options"></div>
        </fieldset>
        <p class="message" id="uploadMessage"></p>
        <button class="primary" type="submit">上传</button>
      </form>
    </section>

    <section class="page" id="corpusPage">
      <div class="section-title">
        <h1>语料库</h1>
      </div>
      <form id="searchForm" class="search-panel">
        <input id="searchKeyword" type="search" placeholder="搜索语段内容">
        <input id="searchTheme" type="search" placeholder="按主题筛选">
        <div id="searchTags" class="tag-options"></div>
        <button class="primary" type="submit">搜索</button>
      </form>
      <p class="muted" id="resultSummary"></p>
      <div class="paragraph-list" id="corpusList"></div>
    </section>

    <section class="page" id="profilePage">
      <div class="profile-header">
        <div>
          <p class="eyebrow">Profile</p>
          <h1 id="profileUsername">我的主页</h1>
          <p class="muted" id="profileCreatedAt"></p>
        </div>
        <div class="profile-actions">
          <button class="secondary" data-page="collections" type="button">我的收藏</button>
          <button class="secondary" data-page="upload" type="button">继续上传</button>
        </div>
      </div>
      <div class="paragraph-list" id="profileList"></div>
    </section>

    <section class="page" id="collectionPage">
      <div class="profile-header">
        <div>
          <p class="eyebrow">Collections</p>
          <h1>我的收藏</h1>
        </div>
        <button class="secondary" data-page="profile" type="button">返回主页</button>
      </div>
      <div class="paragraph-list" id="collectionList"></div>
    </section>

    <section class="page" id="paragraphDetailPage">
      <div class="detail-toolbar">
        <button class="secondary" data-page="corpus" type="button">返回语料库</button>
      </div>
      <div id="paragraphDetail"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/runtimeConfig.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/authService.js"></script>
  <script src="js/collectionService.js"></script>
  <script src="js/themeService.js"></script>
  <script src="js/paragraphService.js"></script>
  <script src="js/searchService.js"></script>
  <script src="js/ui.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
